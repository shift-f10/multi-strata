# Collect only real test modules. Upstream tools/*_test.py are argv-driven
# scripts (they parse sys.argv), not pytest tests, and must not be collected.
#
# testpaths is tools only. serve/ is upstream's quarantined Python service,
# which we never modify, and its suite takes ~4.5 minutes: too slow for the
# pre-push hook. Run `pytest serve` explicitly after merging an upstream
# Strata update.
#
# Left out of the tools/ run:
# - tools/test_iq_pack.py imports llama.cpp's gguf-py (the `gguf` module from
#   third_party/llama.cpp, cloned by setup.py; not a requirements.txt package)
#   and calls sys.exit at import when it is absent.
# - tools/test_setup_engine_hash.py reaches GitHub releases over the public
#   network. Tests must be hermetic: tests/security/README.md forbids public
#   network access in tests.
# - Three tools/test_setup_choices.py tests are recorded upstream drift: they
#   fail with FileNotFoundError on the mocked build/strata (build-hip/strata)
#   copy against the current setup.py, which is off-limits here:
#     HipVision::test_the_cpu_encoder_is_built_once
#     HipVision::test_without_images_nothing_changes
#     CudaVision::test_the_encoder_is_built_native
[pytest]
testpaths = tools
python_files = test_*.py
addopts =
    --ignore=tools/test_iq_pack.py
    --ignore=tools/test_setup_engine_hash.py
    --deselect=tools/test_setup_choices.py::HipVision::test_the_cpu_encoder_is_built_once
    --deselect=tools/test_setup_choices.py::HipVision::test_without_images_nothing_changes
    --deselect=tools/test_setup_choices.py::CudaVision::test_the_encoder_is_built_native
