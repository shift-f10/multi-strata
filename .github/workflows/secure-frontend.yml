name: secure-frontend

# Blocking: linux-gcc, linux-clang, windows-llvm-mingw-cross, windows-msys2-clang,
# top-level-integration. Non-blocking: windows-msvc (informational).
# Network fetches, exactly: the GitHub actions used below; the pip wheels pinned
# in requirements.txt (cmake/ninja) and scripts/dev/requirements-dev.txt (pytest
# and its dependencies) via scripts/dev/bootstrap-linux.sh, plus a pip wheel
# when the venv has no pip; MSYS2 packages via msys2/setup-msys2; and the pinned,
# sha256-checked llvm-mingw tarball (scripts/dev/bootstrap-llvm-mingw.sh).
# No models are downloaded and no GPU backend is enabled. The root configure
# runs with STRATA_NATIVE_EXPERTS=OFF, so no llama.cpp clone (FetchContent) occurs.
on:
  push:
    paths: ["secure_frontend/**", "CMakeLists.txt", "scripts/dev/**", "requirements.txt", "pytest.ini", "tools/**", ".github/workflows/secure-frontend.yml"]
  pull_request:
    paths: ["secure_frontend/**", "CMakeLists.txt", "scripts/dev/**", "requirements.txt", "pytest.ini", "tools/**", ".github/workflows/secure-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dev/bootstrap-linux.sh
      - run: echo "$GITHUB_WORKSPACE/.venv-dev/bin" >> "$GITHUB_PATH"
      - name: pytest (repo root)
        if: matrix.preset == 'linux-gcc'
        run: .venv-dev/bin/pytest -q
      - run: cmake --preset ${{ matrix.preset }}
        working-directory: secure_frontend
      - run: cmake --build --preset ${{ matrix.preset }} --parallel
        working-directory: secure_frontend
      - run: ctest --preset ${{ matrix.preset }}
        working-directory: secure_frontend

  windows-cross:
    name: windows-llvm-mingw-cross (compile+link on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dev/bootstrap-linux.sh && scripts/dev/bootstrap-llvm-mingw.sh
      - run: echo "$GITHUB_WORKSPACE/.venv-dev/bin" >> "$GITHUB_PATH"
      - run: cmake --preset windows-llvm-mingw-cross
        working-directory: secure_frontend
      - run: cmake --build --preset windows-llvm-mingw-cross --parallel
        working-directory: secure_frontend
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-llvm-mingw
          path: secure_frontend/out/build/windows-llvm-mingw-cross/*.exe
          if-no-files-found: error

  windows-msys2:
    name: windows-msys2-clang (runtime tests on Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
      - run: cmake --preset windows-msys2-clang
        working-directory: secure_frontend
      - run: cmake --build --preset windows-msys2-clang --parallel
        working-directory: secure_frontend
      - run: ctest --preset windows-msys2-clang
        working-directory: secure_frontend

  windows-msvc:
    name: windows-msvc (informational, non-blocking)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset windows-msvc
        working-directory: secure_frontend
      - run: cmake --build --preset windows-msvc --parallel
        working-directory: secure_frontend
      - run: ctest --preset windows-msvc
        working-directory: secure_frontend

  top-level-integration:
    name: root CMake with STRATA_BUILD_SECURE_FRONTEND=ON
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dev/bootstrap-linux.sh
      - run: echo "$GITHUB_WORKSPACE/.venv-dev/bin" >> "$GITHUB_PATH"
      - run: cmake -S . -B out/root -G Ninja -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_BUILD_SECURE_FRONTEND=ON -DSTRATA_BUILD_SECURE_FRONTEND_TESTS=ON
      - run: cmake --build out/root --target strata-secure-server secure_frontend_config_tests --parallel
      # With these flags the root build registers no tests, so ctest must target
      # the frontend's test dir; --no-tests=error stops a vacuous pass.
      - run: ctest --test-dir out/root/secure_frontend -R secure_frontend_config_tests --no-tests=error --output-on-failure
